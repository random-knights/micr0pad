name: CI Gate

# The single required check for this repo. It runs on every pull request to
# main and on every push to main, and it reports one pass/fail context named
# exactly "CI Gate".
#
# NO `paths:` FILTER, on purpose. A workflow skipped by a paths filter never
# reports its context at all, so a required-check ruleset waits forever on a
# status that will never arrive and the PR cannot merge. The job always runs
# and always concludes. This repo is small enough that scoping the work inside
# the job would save seconds, so there is nothing conditional here either.
#
# Do not rename the job. The ruleset requires the context by name.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "20"

      # --ignore-scripts skips node-hid's native install step. That module is
      # the only dependency, it needs libudev headers to build from source on
      # Linux, and nothing under test loads it: the tests cover the pure
      # modules (analytics, preflight, packaging) and never open a device.
      # Installing it here would trade ten minutes of build time for no extra
      # coverage. The tradeoff is real and stated: a break in the HID path is
      # NOT caught by this gate, and cannot be, because the runner has no pad.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run the test suite
        run: npm test

      # The npm package, checked on every change. check-pack fails on a missing
      # required file, on anything that must never ship (tests, config.json,
      # logs, keys, env files) and on any file git does not track. The dry-run
      # publish runs the same prepublishOnly hook a real publish runs, and
      # needs no login and no token. The smoke installs the packed tarball
      # into an empty folder from the registry, runs the bin with the device
      # disabled until /api/state answers 200, then again with node-hid left
      # out entirely to prove the virtual pad needs no native module.
      - name: Check the npm tarball
        run: npm run check-pack

      - name: Dry-run publish
        run: npm publish --dry-run

      - name: Install the packed tarball and run the bin
        run: node scripts/smoke-pack.js

      # The check must say what it did. A green gate that silently ran nothing
      # is the failure this step exists to prevent.
      - name: Report what this gate ran
        run: |
          echo "CI Gate ran: npm ci --ignore-scripts, npm test (node:test), check-pack, npm publish --dry-run, and the packed-tarball smoke."
          echo "Not covered here: anything that needs the physical device."
